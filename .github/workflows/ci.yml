name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Placeholders — the build does not connect to the DB or to any provider.
      DATABASE_URL: postgresql://user:password@localhost:5432/blitzit?schema=public
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      RUNNER_ENABLED: 'false'
      # `next build` runs with NODE_ENV=production, where env validation
      # requires an auth secret. Build-only dummy — never used to sign anything
      # real; the deployed environment supplies its own secret.
      BETTER_AUTH_SECRET: ci-build-only-placeholder-secret-32chars
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npm run prisma:generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Build
        run: npm run build
